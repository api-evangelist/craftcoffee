aid: craftcoffee
name: CraftCoffee
description: >-
  Craft Coffee is a direct-to-consumer specialty coffee company operating since 2011 that sources,
  roasts, and ships freshly roasted coffee to subscribers across the United States. Its storefront
  offers flexible, commitment-free coffee subscriptions plus one-off bags, gift subscriptions, and a
  preference-matching engine that recommends blends and single-origin coffees (Into the Black,
  Streetlight, Sumatra, Throwback, and more) based on customer taste. The business runs on a Shopify
  commerce stack with Shopify Customer Accounts for authenticated login; it is a consumer e-commerce
  brand and does not currently publish a public developer API, SDKs, or API documentation. Added to
  the API Evangelist network as a 500 Global portfolio company for ongoing discovery and enrichment.
